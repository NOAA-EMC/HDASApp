_filenames: &fv3file_names
  filename_core: '20240630.120000.fv_core.res.tile1.nc'
  filename_trcr: '20240630.120000.fv_tracer.res.tile1.nc'
  filename_sfcd: '20240630.120000.sfc_data.nc'
  filename_sfcw: '20240630.120000.fv_srf_wnd.res.tile1.nc'
  filename_cplr: '20240630.120000.coupler.res'

_geometry: &geometry_configs
  namelist filename: DataFix/input_hafs.nml
  akbk: DataFix/akbk.nc
  npx: 721
  npy: 541
  npz: 65
  layout: [30,20]
  io_layout: [1,1]
  ntiles: 1

cost function:
  cost type: 3D-Var
  time window:
    begin: &InitialDate '2024-06-30T09:00:00Z'
    length: PT6H
  geometry:
    fms initialization:
      namelist filename: DataFix/fmsmpp.nml
      field table filename: DataFix/field_table
    <<: *geometry_configs
  analysis variables: &ana_vars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  background:
    datetime: &AnaDate '2024-06-30T12:00:00Z'
    filetype: fms restart
    datapath: Data/bkg
    <<: *fv3file_names
    state variables: &state_vars 
    - eastward_wind
    - northward_wind
    - upward_air_velocity
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
    - geopotential_height_times_gravity_at_surface
    - slmsk
    - sheleg
    - skin_temperature_at_surface
    - vtype
    - stype
    - vfrac
    - stc
    - soilMoistureVolumetric
    - eastward_wind_at_surface
    - northward_wind_at_surface
    - f10m
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      upward_air_velocity: W
      air_temperature: T
      air_pressure_thickness: delp
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_water: liq_wat
      ozone_mass_mixing_ratio: o3mr
      layer_thickness: DZ
      skin_temperature_at_surface: tsea
      air_pressure_at_surface: ps
      cloud_liquid_ice: ice_wat
      geopotential_height_times_gravity_at_surface: phis
      soilMoistureVolumetric: smc
#      totalSnowDepth: snwdph
      eastward_wind_at_surface: u_srf
      northward_wind_at_surface: v_srf
  background error:
    covariance model: ensemble
    members from template:
      template:
        datetime: *AnaDate
        filetype: fms restart
        state variables: *state_vars
        datapath: ens/mem%mem%/
        <<: *fv3file_names
      pattern: '%mem%'
      nmembers: 10
      zero padding: 3
    localization:
      localization method: SABER
      saber central block:
        saber block name: BUMP_NICAS
        active variables: *ana_vars
        read:
          io:
            data directory: Data/bump
            files prefix: fv3jedi_bumpparameters_nicas_lam_atm
            alias:
            - in code: common
              in file: t_250km
          drivers:
             multivariate strategy: duplicated
             read local nicas: true
#------------------------------------------------------------------------------
  observations:
     observers:
@OBSERVATIONS@

variational:
  minimizer:
    algorithm: DRPCG    # Derber-Rosati Conjugate Gradients
  iterations:
  - ninner: 50
    gradient norm reduction: 1e-10
    test: on
    geometry:
      fms initialization:
        namelist filename: DataFix/fmsmpp.nml
        field table filename: DataFix/field_table
      fieldsets:
        fieldset: DataFix/dynamics_lam_cmaq.yaml
      <<: *geometry_configs
    diagnostics:
      departures: ombg
final:
  diagnostics:
    departures: oman

output:
  filetype: fms restart
  datapath: Data/analysis/
  prefix: envar-fv3_hafs_singleobs 
  frequency: PT3H

